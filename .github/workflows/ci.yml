#this will show up on the github actions tab when opening the repo on github (no affect on the pipeline)
name: CI Pipeline to rebuild magnetics_cpp .so for Vercel

#inside this are the push and pull request events and inside those you write that
#on = tell github when to run your workflow
on:
  #these are events that will happen in the repository, a signal that tells github something changed
  push:
    #this will run whenever it pushes the code to the 'main' branch
    branches: [main]
    #but only if the push changes something inside src/ or changes CMakeLists.txt
    paths:
      - "src/**"
      - "CMakeLists.txt"

#this will be the major unit of work inside the github actions workflow
jobs:
  #this is the job (only have 1)
  rebuild-so:
    #whenever a jobs run, github will use its own Virtual Machine aka a fresh computer that exists only for the duration of the job, in this case we have github create a ubuntu linux machine and keep in mind they start in a clean predictable environment everytime it runs
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    #the instructions that tell github what to do on the machine
    steps:
      #name property here: is a simple human-readable label for the step. It helps with understanding what the step is doing when looking at the workflow logs (github does not use this for execution)
      - name: Install build toolchain
        #this installs everything needed to compile my C++ Python module
        run: |
          dnf install -y git gcc-c++ cmake python3.12 python3.12-devel python3.12-pip

      #need to have the pybind11 installed to run
      - name: Install pybind11
        run: python3.12 -m pip install pybind11

      - name: Checkout
        #uses tells github to use an existing github action that has been used by someone so instead of of writing everything from scratch, this allows to reuse actions built by github
        #the checkout job is to download a copy of our repo onto the VM so the workflow can access our code and without this step the VM will be empty and not know about our project
        uses: actions/checkout@v4

      #this tells git that this is trusted repo directory, allow commands to run here
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"


      #does not compile here, it just tells Cmake how the project should be built
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE=/usr/bin/python3.12 \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++
      
      #actually compile it here and build the magnetics_cpp target not every other target and use all available CPU cores
      - name: Build magnetics_cpp
        run: cmake --build build --target magnetics_cpp -- -j"$(nproc)"
      
      #find the newly created .so, the built_so will be used after compiling and it searches for the right one instead of hardcoding it
      - name: Verify rebuilt .so
        run: |
          if [ ! -f python/magnetics_cpp.cpython-312-x86_64-linux-gnu.so ]; then
            echo "::error::no magnetics_cpp .so produced by the build"
            exit 1
          fi
        
      #checking if the binary actually changed or if the .so stay the same version that was committed
      - name: Commit rebuilt .so if it changed
        run: |
          if git diff --quiet -- python/magnetics_cpp.cpython-312-x86_64-linux-gnu.so; then
            echo "No change to the .so - nothing to commit."
            exit 0
          fi
          git config user.name "chrishernzz"
          git config user.email "christianhernandez1014@gmail.com"
          git add python/magnetics_cpp.cpython-312-x86_64-linux-gnu.so
          git commit -m "chore(ci): rebuild magnetics_cpp .so for updated C++ bindings [skip ci]"
          git push origin HEAD:main